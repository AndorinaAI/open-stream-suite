<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Gradiente Cyan Streaming -->
    <linearGradient id="hCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#57D6C4"/>
    </linearGradient>

    <!-- Gradiente Coral Neón -->
    <linearGradient id="hCoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO (IZQUIERDA) -->
  <g transform="translate(110, 110)">
    <!-- Arco exterior 1: Broadcast ring (Cian) -->
    <path d="M -70,-40 A 80,80 0 1,1 -70,40" 
          fill="none" 
          stroke="url(#hCyanGrad)" 
          stroke-width="16" 
          stroke-linecap="round"/>

    <!-- Arco interior 2: Señal de transmisión (Coral) -->
    <path d="M -42,-24 A 48,48 0 1,1 -42,24" 
          fill="none" 
          stroke="url(#hCoralGrad)" 
          stroke-width="13" 
          stroke-linecap="round"/>

    <!-- Núcleo central: Triángulo Play / Emisor de Stream (Blanco puro) -->
    <path d="M -12,-22 L 28,0 L -12,22 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="7" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- TIPOGRAFÍA Y BRANDING (DERECHA) -->
  <g transform="translate(230, 0)">
    <!-- Título Principal -->
    <text x="0" y="105" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="1.5">
      <tspan fill="#F0F6FC">OPEN </tspan>
      <tspan fill="url(#hCyanGrad)">STREAM </tspan>
      <tspan fill="#F0F6FC">SUITE</tspan>
    </text>

    <!-- Subtítulo / Descriptor de Producto -->
    <text x="2" y="145" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="4" 
          fill="#8B949E">
      MODULAR BROADCAST &amp; OVERLAYS · OBS STUDIO
    </text>

    <!-- Badges minimalistas SVG -->
    <g transform="translate(2, 168)">
      <!-- Badge 1: 100% Local -->
      <rect x="0" y="0" width="88" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="10" cy="10" r="3" fill="#3FB950"/>
      <text x="20" y="14" font-family="monospace" font-size="10" fill="#8B949E" font-weight="600">100% LOCAL</text>

      <!-- Badge 2: Open Source -->
      <rect x="96" y="0" width="84" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="106" y="14" font-family="monospace" font-size="10" fill="#57D6C4" font-weight="600">MODULAR</text>

      <!-- Badge 3: Hardware Decks -->
      <rect x="188" y="0" width="102" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="198" y="14" font-family="monospace" font-size="10" fill="#FF9E3B" font-weight="600">DECK READY</text>
    </g>
  </g>
</svg>
