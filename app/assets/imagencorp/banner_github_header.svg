<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <!-- Gradientes principales -->
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#57D6C4"/>
    </linearGradient>

    <linearGradient id="bCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>

    <linearGradient id="bTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57D6C4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#57D6C4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FF783F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF783F" stop-opacity="0"/>
    </linearGradient>

    <!-- Fondo con gradiente sutil -->
    <radialGradient id="bBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="60%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#07090D"/>
    </radialGradient>
  </defs>

  <!-- Fondo Obsidian -->
  <rect width="1280" height="400" fill="url(#bBg)"/>

  <!-- Línea decorativa superior sutil -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#bTopLine)"/>

  <!-- Trama de puntos muy sutil (Matrix / Tech Grid) -->
  <g opacity="0.08" fill="#57D6C4">
    <circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/>
    <circle cx="960" cy="80" r="1.5"/><circle cx="1040" cy="80" r="1.5"/><circle cx="1120" cy="80" r="1.5"/>
    <circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/>
    <circle cx="960" cy="160" r="1.5"/><circle cx="1040" cy="160" r="1.5"/><circle cx="1120" cy="160" r="1.5"/>
    <circle cx="160" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/>
    <circle cx="960" cy="240" r="1.5"/><circle cx="1040" cy="240" r="1.5"/><circle cx="1120" cy="240" r="1.5"/>
    <circle cx="160" cy="320" r="1.5"/><circle cx="240" cy="320" r="1.5"/><circle cx="320" cy="320" r="1.5"/>
    <circle cx="960" cy="320" r="1.5"/><circle cx="1040" cy="320" r="1.5"/><circle cx="1120" cy="320" r="1.5"/>
  </g>

  <!-- ISOTIPO CENTRAL -->
  <g transform="translate(640, 110)">
    <!-- Glow sutil de fondo -->
    <circle cx="0" cy="0" r="90" fill="#57D6C4" opacity="0.05" filter="blur(20px)"/>

    <!-- Arco exterior 1: Broadcast ring (Cian) -->
    <path d="M -78,-44 A 90,90 0 1,1 -78,44" 
          fill="none" 
          stroke="url(#bCyan)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Arco interior 2: Señal de transmisión (Coral) -->
    <path d="M -48,-28 A 56,56 0 1,1 -48,28" 
          fill="none" 
          stroke="url(#bCoral)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Núcleo central: Triángulo Play / Emisor de Stream (Blanco puro) -->
    <path d="M -13,-24 L 32,0 L -13,24 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- TÍTULO PRINCIPAL (CENTRADO) -->
  <text x="640" y="235" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="2">
    <tspan fill="#F0F6FC">OPEN </tspan>
    <tspan fill="url(#bCyan)">STREAM </tspan>
    <tspan fill="#F0F6FC">SUITE</tspan>
  </text>

  <!-- SUBTÍTULO / PROPÓSITO -->
  <text x="640" y="275" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="16" 
        font-weight="500" 
        letter-spacing="1" 
        fill="#8B949E">
    Suite de Control, Alertas, Overlays Modulares y Plugins de Decks para OBS Studio
  </text>

  <!-- BADGES Y METADATOS (CENTRADO) -->
  <g transform="translate(640, 310)">
    <!-- Grupo de badges centrado (total ancho aprox: 560px, desplazado -280) -->
    <g transform="translate(-275, 0)">
      <!-- Badge Versión -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <circle cx="14" cy="13" r="3.5" fill="#3FB950"/>
        <text x="24" y="17" font-family="monospace" font-size="11" fill="#F0F6FC" font-weight="700">v1.0.0-α</text>
      </g>

      <!-- Badge 100% Local -->
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="105" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" font-family="monospace" font-size="11" fill="#57D6C4" font-weight="700">100% LOCAL</text>
      </g>

      <!-- Badge Decks Hardware -->
      <g transform="translate(225, 0)">
        <rect x="0" y="0" width="180" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" font-family="monospace" font-size="11" fill="#FF9E3B" font-weight="700">AJAZZ · ELGATO · OPENDECK</text>
      </g>

      <!-- Badge Cero Nube -->
      <g transform="translate(415, 0)">
        <rect x="0" y="0" width="135" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="14" y="17" font-family="monospace" font-size="11" fill="#A78BFA" font-weight="700">PRIVACIDAD TOTAL</text>
      </g>
    </g>
  </g>
</svg>
