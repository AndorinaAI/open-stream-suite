<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Cyan Streaming -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#57D6C4"/>
    </linearGradient>

    <!-- Gradiente Coral Neón -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>

    <!-- Gradiente Dark Fondo -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090D12"/>
    </radialGradient>
  </defs>

  <!-- Contenedor Squircle / Icono App -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#30363D" stroke-width="2"/>

  <!-- SÍMBOLO MINIMALISTA: ONDA DE BROADCAST + PRISMA DE STREAMING -->
  <g transform="translate(256, 256)">
    <!-- Arco exterior 1: Broadcast ring (Cian) -->
    <path d="M -130,-75 A 150,150 0 1,1 -130,75" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Arco interior 2: Señal de transmisión (Coral) -->
    <path d="M -80,-45 A 92,92 0 1,1 -80,45" 
          fill="none" 
          stroke="url(#coralGrad)" 
          stroke-width="22" 
          stroke-linecap="round"/>

    <!-- Núcleo central: Triángulo Play / Emisor de Stream (Blanco puro / acento) -->
    <path d="M -22,-44 L 54,0 L -22,44 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
