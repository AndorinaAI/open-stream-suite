<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#57D6C4"/>
    </linearGradient>
    <linearGradient id="favCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E3B"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0D1117"/>

  <g transform="translate(32, 32)">
    <!-- Arco exterior: Broadcast ring (Cian) -->
    <path d="M -16,-9 A 18.5,18.5 0 1,1 -16,9" 
          fill="none" 
          stroke="url(#favCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- Arco interior: Señal de transmisión (Coral) -->
    <path d="M -10,-5.5 A 11.5,11.5 0 1,1 -10,5.5" 
          fill="none" 
          stroke="url(#favCoral)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- Núcleo central: Triángulo Play (Blanco) -->
    <path d="M -3,-5 L 7,0 L -3,5 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
