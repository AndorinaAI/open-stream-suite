<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Open Stream Suite — Chat en Pantalla, Badges & Spotlight</title>
  <link rel="stylesheet" href="../../common/fonts.css">
  <link rel="stylesheet" href="../../common/styles.css">
  <link rel="stylesheet" href="../../common/generated/archetypes.css">
  <link rel="stylesheet" href="../../common/generated/shapes.css">
  <link rel="stylesheet" href="../../common/themes.css">
  <link rel="stylesheet" href="../../common/components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../common/oss-skin.css">
  <style id="custom-user-css"></style>
</head>
<body>

  <!-- Canvas para física de partículas de emoticonos -->
  <canvas id="particle-canvas"></canvas>

  <!-- 📌 Tarjeta de Mensaje Destacado (Spotlight) -->
  <div id="chat-spotlight-box">
    <div class="spotlight-card">
      <div class="spotlight-badge">
        <span>📌</span>
        <span>MENSAJE DESTACADO DEL DIRECTO</span>
      </div>
      <div id="spotlight-author" class="spotlight-user" style="color: #57D6C4;">Usuario</div>
      <div id="spotlight-content" class="spotlight-text">Texto destacado...</div>
    </div>
  </div>

  <!-- Contenedor del chat -->
  <div id="chat-box" class="chat-container" data-oss-panel="true"></div>

  <script src="../../config.js"></script>
  <script src="../../common/audio-synth.js"></script>
  <script src="particles.js"></script>
  <script src="js/styles.js?v=50"></script>
  <script src="js/parser.js?v=50"></script>
  <script src="js/render.js?v=50"></script>
  <script src="js/network.js?v=50"></script>
  <script src="../../common/oss-shape.js"></script>
  <script src="../../common/oss-skin.js"></script>
  <script src="../../common/widget-theme.js"></script>
  <script src="widget.js?v=50"></script>
</body>
</html>
