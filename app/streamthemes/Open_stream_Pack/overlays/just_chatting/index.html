<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay — Just Chatting & Talk</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 30px;
      box-sizing: border-box;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-family: var(--font-primary);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-md);
      padding: 12px 24px;
      backdrop-filter: blur(12px);
    }
    .stream-tag {
      font-weight: 800;
      font-size: 16px;
      color: var(--color-accent-cyan);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-pill {
      font-size: 14px;
      color: var(--color-text-light);
      background: rgba(0,0,0,0.3);
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--color-accent-orange);
    }
    .main-stage {
      display: flex;
      gap: 24px;
      flex: 1;
      margin: 20px 0;
    }
    .cam-box {
      flex: 3;
      border: 2px solid var(--color-border-cyan-bright);
      border-radius: var(--radius-md);
      background: rgba(0,0,0,0.25);
      position: relative;
      box-shadow: var(--theme-glow);
    }
    .cam-label {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--color-bg-dark);
      border: 1px solid var(--color-border-cyan);
      color: var(--color-accent-cyan);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }
    .chat-column {
      flex: 1;
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-md);
      background: var(--color-panel-bg-trans);
      backdrop-filter: blur(8px);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      font-size: 13px;
      font-weight: 800;
      color: var(--color-accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-border-dim);
      margin-bottom: 12px;
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-md);
      padding: 10px 24px;
      font-size: 13px;
      color: var(--color-text-dim);
    }
    .social-tag {
      color: var(--color-text-light);
      font-weight: 600;
    }
  </style>
</head>
<body data-theme="neon_streamer">
  <div class="top-bar">
    <div class="stream-tag">💬 <span>JUST CHATTING & COMUNIDAD</span></div>
    <div class="topic-pill" id="lbl-topic">Charla abierta con el chat & Noticias destacadas</div>
  </div>
  <div class="main-stage">
    <div class="cam-box">
      <div class="cam-label">CAM // EN VIVO</div>
    </div>
    <div class="chat-column">
      <div class="chat-header">💬 CHAT EN DIRECTO</div>
      <div style="flex:1;"></div>
    </div>
  </div>
  <div class="bottom-bar">
    <div>🔴 DIRECTO OFICIAL</div>
    <div>SÍGUENOS EN REDES: <span class="social-tag">@MiCanalTwitch</span></div>
  </div>
  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
