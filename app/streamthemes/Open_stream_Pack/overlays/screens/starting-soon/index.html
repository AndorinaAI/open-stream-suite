<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Empezamos Pronto</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-light);
      font-family: var(--font-primary);
      position: relative;
      overflow: hidden;
    }
    .pulse-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--color-accent-cyan) 0%, transparent 70%);
      opacity: 0.15;
      animation: pulse 4s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.1; }
      100% { transform: scale(1.1); opacity: 0.22; }
    }
    .title-box {
      position: relative;
      z-index: 2;
      text-align: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-lg);
      padding: 48px 72px;
      backdrop-filter: blur(16px);
      box-shadow: var(--theme-glow);
    }
    h1 {
      font-size: 54px;
      font-weight: 900;
      margin: 0 0 12px 0;
      color: var(--color-accent-cyan);
      letter-spacing: 2px;
    }
    p {
      font-size: 20px;
      color: var(--color-text-dim);
      margin: 0;
    }
  </style>
</head>
<body data-theme="neon_streamer">
  <div class="pulse-glow"></div>
  <div class="title-box">
    <h1>EMPEZAMOS EN BREVE</h1>
    <p>Ajustando audio, cámara y preparándolo todo...</p>
  </div>
  <script src="/config.js"></script>
</body>
</html>
