<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Empezamos Pronto (Open Stream)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--color-text-light);
      font-family: var(--font-primary);
      position: relative;
      overflow: hidden;
      padding: 50px 70px;
      box-sizing: border-box;
    }
    .pulse-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, var(--color-accent-cyan) 0%, transparent 70%);
      opacity: 0.16;
      animation: pulse 4s infinite alternate;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.1; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.22; }
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-name {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 2px;
    }
    .brand-tagline {
      font-size: 12px;
      color: var(--color-accent-cyan);
      font-family: var(--font-tech);
      letter-spacing: 1px;
    }
    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-tech);
      font-size: 12px;
      font-weight: 800;
      color: var(--color-accent-orange);
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,120,63,0.4);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
    }
    .center-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }
    .tag-line {
      font-family: var(--font-tech);
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--color-accent-cyan);
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 800;
    }
    h1.main-stream-title {
      font-size: 72px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 2px;
      color: #FFFFFF;
      line-height: 1.1;
    }
    .title-cyan-accent {
      color: var(--color-accent-cyan);
      text-shadow: var(--theme-glow);
    }
    p.stream-subtitle {
      font-size: 20px;
      color: var(--color-text-dim);
      margin: 16px 0 28px 0;
      max-width: 800px;
    }
    .tech-progress-bar {
      width: 640px;
      height: 8px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--color-border-cyan);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .tech-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-accent-cyan), var(--color-accent-orange));
      box-shadow: 0 0 12px var(--color-accent-cyan);
      transition: width 1s linear;
    }
    .countdown-display {
      font-family: var(--font-tech);
      font-size: 48px;
      font-weight: 900;
      color: var(--color-accent-cyan);
      letter-spacing: 4px;
      text-shadow: 0 0 18px var(--color-accent-cyan);
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 16px;
      font-size: 13px;
      color: var(--color-text-dim);
    }
  </style>
</head>
<body data-theme="neon_streamer" data-scene="oss_starting">
  <div class="pulse-glow"></div>

  <div class="top-bar">
    <div class="brand-box">
      <span class="brand-name">OPEN STREAM</span>
      <span class="brand-tagline">// EMISIÓN EN DIRECTO</span>
    </div>
    <div class="live-status">
      <span>●</span> <span data-text-key="status">TRANSMISIÓN INICIANDO</span>
    </div>
  </div>

  <div class="center-stage starting-hero-text">
    <div class="tag-line">// EN DIRECTO EN BREVES MINUTOS</div>
    <h1 class="main-stream-title">
      ENSEGUIDA<br>
      <span class="title-cyan-accent">ESTAMOS EN DIRECTO</span>
    </h1>
    <p class="stream-subtitle">Ajustando cámaras, audio y preparándolo todo para empezar.</p>

    <!-- Barra de progreso sincronizada -->
    <div class="tech-progress-bar">
      <div class="tech-progress-fill"></div>
    </div>
    <!-- Contador numérico sincronizado -->
    <div class="countdown-display starting-countdown">05:00</div>
  </div>

  <div class="bottom-bar">
    <div class="footer-note">OPEN STREAM SUITE · STREAMING PRO MULTI-ESCENA</div>
    <div>SÍGUENOS EN REDES: <b style="color:var(--color-text-light);">@MiCanalTwitch</b></div>
  </div>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
