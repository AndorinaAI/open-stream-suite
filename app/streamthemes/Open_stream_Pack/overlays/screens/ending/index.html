<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Fin del Stream</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-light);
      font-family: var(--font-primary);
    }
    .box {
      text-align: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-lg);
      padding: 44px 70px;
      box-shadow: var(--theme-glow);
    }
    h1 {
      font-size: 50px;
      color: var(--color-accent-cyan);
      margin: 0 0 12px 0;
    }
  </style>
</head>
<body data-theme="neon_streamer">
  <div class="box">
    <h1>¡GRACIAS POR ACOMPAÑARNOS!</h1>
    <p style="color:var(--color-text-dim); font-size:20px;">Nos vemos en el próximo directo.</p>
  </div>
  <script src="/config.js"></script>
</body>
</html>
