<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<!-- preload-fonts:T4 (generado por scripts/apply_font_preloads.py) -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/inter_normal_600.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/inter_normal_700.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/inter_normal_800.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_700.woff2">
<!-- /preload-fonts:T4 -->
  <title>Open Stream Suite — Swiss Broadcast Pantalla Compartida</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      position: relative;
      font-family: var(--font-primary, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif);
      color: #f8fafc;
    }

    /* Screen Source Indicator Pill */
    .screen-pill {
      position: absolute;
      top: 24px;
      left: 28px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .screen-pill .icon {
      color: var(--color-accent-cyan, #38bdf8);
      font-size: 15px;
    }
    .screen-pill .badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--color-accent-cyan, #38bdf8);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* Picture in Picture Webcam Box */
    .pip-cam-box {
      position: absolute;
      bottom: 32px;
      right: 36px;
      width: 420px;
      height: 236px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 30;
    }
    .cam-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .pip-label-bar {
      margin: 12px;
      background: var(--color-panel-bg, rgba(15, 23, 42, 0.85));
      backdrop-filter: var(--panel-backdrop, blur(14px));
      -webkit-backdrop-filter: var(--panel-backdrop, blur(14px));
      border: 1px solid var(--color-border-cyan, rgba(255, 255, 255, 0.12));
      border-radius: var(--panel-radius, 6px);
      padding: 6px 12px;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-light, #f8fafc);
      position: absolute !important;
      top: auto !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: auto !important;
      box-sizing: border-box !important;
      z-index: 10;
    }
    .pip-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-accent-cyan, #38bdf8);
    }
    .pip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Minimalist Bottom Left Info Card */
    .stream-info-card {
      position: absolute;
      bottom: 32px;
      left: 36px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .stream-info-card span.highlight {
      color: #f8fafc;
      font-weight: 800;
    }
  </style>
</head>
<body data-pack="Open_stream_Pack" data-scene="oss_desktop" data-theme="clean_minimal">
  <!-- Top Left Screen Source -->
  <header class="panel-card screen-pill" data-oss-panel="true">
    <span class="icon">🖥️</span>
    <span data-text-key="channel.tagline">CAPTURA DE PANTALLA // DEMOSTRACIÓN</span>
    <span class="mode-badge badge" data-oss-badge="true">1080p SOURCE</span>
  </header>

  <!-- Bottom Left Info Card -->
  <footer class="panel-card stream-info-card" data-oss-panel="true" data-oss-bar="bottom">
    <div>TRANSMISIÓN EN DIRECTO: <span class="highlight" data-text-key="channel.name">OPEN STREAM SUITE</span></div>
    <div style="color: rgba(255,255,255,0.2);">|</div>
    <div>SÍGUENOS: <span class="highlight" data-text-key="channel.name">@andorina</span></div>
  </footer>

  <!-- Picture in Picture Presenter Webcam -->
  <div class="camera-frame pip-cam-box camera-face" data-oss-cam="true">
    <div class="cam-viewport" data-oss-viewport="true"></div>
    <div class="pip-label-bar cam-bottom-bar" data-oss-cam-label="bar">
      <span data-text-key="oss.desktopCam">STREAMER // PRESENTADOR</span>
      <div class="pip-status">
        <span class="pip-dot"></span>
        <span>MIC ACTIVO</span>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <!-- Módulos críticos cargados antes del primer pintado: evita que el DOM se
       complete después y que los elementos se recoloquen (T4-seguimiento). -->
  <script src="/common/overlay/icons.js?v=50"></script>
  <script src="/common/overlay/dom-injector.js?v=50"></script>
  <script src="/common/overlay/interactive-features.js?v=50"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
