<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay — Pantalla Compartida</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      position: relative;
      font-family: var(--font-primary);
    }
    .floating-cam {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 440px;
      height: 250px;
      border: 2px solid var(--color-accent-cyan);
      border-radius: var(--radius-md);
      background: rgba(0,0,0,0.3);
      box-shadow: var(--theme-glow);
    }
    .floating-cam::after {
      content: 'WEBCAM';
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 10px;
      font-weight: 800;
      color: var(--color-accent-cyan);
      background: var(--color-bg-dark);
      padding: 2px 8px;
      border-radius: 3px;
    }
    .top-banner {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      color: var(--color-text-light);
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body data-theme="neon_streamer">
  <div class="top-banner">💻 PANTALLA // DEMOSTRACIÓN</div>
  <div class="floating-cam"></div>
  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
