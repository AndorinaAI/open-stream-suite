<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay — Podcast & Entrevista (Dual Cam)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 40px;
      box-sizing: border-box;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-family: var(--font-primary);
    }
    .header-bar {
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-md);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: var(--panel-backdrop, blur(10px)); border-radius: var(--panel-radius, 8px); clip-path: var(--panel-clip-path, none); box-shadow: var(--panel-shadow, none);
    }
    .podcast-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--color-accent-cyan);
      letter-spacing: 1px;
    }
    .cam-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      flex: 1;
      margin: 28px 0;
    }
    .guest-cam {
      border: 2px solid var(--color-border-cyan-bright); border-radius: var(--frame-radius, 4px); clip-path: var(--frame-clip-path, none); box-shadow: var(--frame-shadow, var(--theme-glow));
      background: rgba(0,0,0,0.3);
      position: relative;
      box-shadow: var(--theme-glow);
    }
    .guest-nameplate {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: var(--color-panel-bg);
      border: 1px solid var(--color-border-cyan);
      border-left: 4px solid var(--color-accent-cyan);
      padding: 6px 16px;
      border-radius: var(--radius-sm);
      color: var(--color-text-light);
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body data-theme="neon_streamer">
  <div class="header-bar">
    <div class="podcast-title">🎙️ PODCAST // EN DIRECTO</div>
    <div style="font-size:13px; color:var(--color-accent-orange); font-weight:700;">EPISODIO ESPECIAL</div>
  </div>
  <div class="cam-grid">
    <div class="guest-cam">
      <div class="guest-nameplate">HOST PRINCIPAL</div>
    </div>
    <div class="guest-cam">
      <div class="guest-nameplate" style="border-left-color: var(--color-accent-orange);">INVITADO ESPECIAL</div>
    </div>
  </div>
  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
