<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay — Study With Me & Pomodoro</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 36px;
      box-sizing: border-box;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: var(--font-primary);
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-lg);
      padding: 12px 28px;
      backdrop-filter: blur(12px);
    }
    .main-grid {
      display: flex;
      gap: 30px;
      flex: 1;
      margin: 24px 0;
    }
    .cam-frame {
      flex: 3;
      border: 2px solid var(--color-border-cyan-bright);
      border-radius: var(--radius-lg);
      background: rgba(0,0,0,0.2);
      box-shadow: var(--theme-glow);
    }
    .pomodoro-card {
      flex: 1;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(10px);
    }
    .pomo-time {
      font-size: 46px;
      font-weight: 800;
      color: var(--color-accent-cyan);
    }
  </style>
</head>
<body data-theme="latte_caramel">
  <div class="header-bar">
    <div style="font-size:16px; font-weight:700; color:var(--color-accent-cyan);">☕ STUDY & FOCUS TIME</div>
    <div style="color:var(--color-text-dim); font-size:13px;">SESIÓN RELAJADA // MÚSICA LO-FI</div>
  </div>
  <div class="main-grid">
    <div class="cam-frame"></div>
    <div class="pomodoro-card">
      <div style="font-size:14px; font-weight:700; color:var(--color-text-light);">POMODORO ACTIVO</div>
      <div class="pomo-time">25:00</div>
      <div style="font-size:12px; color:var(--color-text-dim);">Fase de Concentración</div>
    </div>
  </div>
  <script src="/config.js"></script>
</body>
</html>
