<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Despedida y Buenas Noches (Cozy)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: radial-gradient(circle at center, #231C24 0%, var(--color-bg-dark, #151218) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', 'Comfortaa', var(--font-primary), sans-serif;
      overflow: hidden;
    }

    .ending-card {
      text-align: center;
      background: var(--color-panel-bg, rgba(48, 38, 30, 0.9));
      backdrop-filter: var(--panel-backdrop, blur(20px));
      border: 1.5px solid var(--color-border-cyan, rgba(196, 130, 67, 0.28));
      border-radius: 36px;
      padding: 54px 84px;
      box-shadow: 0 24px 60px rgba(15, 10, 20, 0.4);
      min-width: 700px;
    }

    .moon-icon {
      font-size: 52px;
      margin-bottom: 12px;
      display: inline-block;
    }

    h1 {
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--color-text-light, #FDFBF7);
      margin: 6px 0 10px 0;
    }

    p {
      font-size: 16px;
      color: var(--color-text-dim, #B3A091);
      margin: 0 0 26px 0;
      line-height: 1.6;
    }

    .credits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }

    .credit-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 14px 18px;
      text-align: left;
    }

    .credit-label {
      font-size: 11px;
      color: var(--color-accent-orange, #E0C097);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .credit-names {
      font-size: 13px;
      color: var(--color-text-light, #FDFBF7);
      font-weight: 600;
    }

    .social-pills-row {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--color-text-light, #FDFBF7);
    }
  </style>
</head>
<body data-pack="Cozy_LoFi_Pack" data-scene="cozy_ending" data-theme="nordic_twilight">

  <div class="panel-card ending-card" data-oss-panel="true">
    <div class="moon-icon">🌙 ✨</div>

    <h1 class="main-stream-title" data-text-key="ending.title">STREAM FINALIZADO</h1>
    <p class="stream-subtitle" data-text-key="ending.subtitle">¡Muchas gracias por acompañarme y por vuestra compañía! ¡Que descanses!</p>

    <div class="credits-grid">
      <div class="credit-box">
        <div class="credit-label">⭐ Comunidad & Subs</div>
        <div class="credit-names" data-text-key="ending.credits.0">Gracias por el apoyo a todos los suscriptores y vips</div>
      </div>
      <div class="credit-box">
        <div class="credit-label">💬 Próximo Stream</div>
        <div class="credit-names" data-text-key="ending.credits.1">Nos vemos en el próximo directo</div>
      </div>
    </div>

    <div class="social-pills-row">
      <span class="social-pill" data-text-key="channel.name">🟣 twitch.tv/andorina</span>
      <span class="social-pill">💬 discord.gg/comunidad</span>
      <span class="social-pill" data-text-key="channel.tagline">✨ relax & chill</span>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
