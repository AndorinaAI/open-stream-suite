<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Empezamos en breve (Cozy)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-primary);
    }
    .card {
      text-align: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: 20px;
      padding: 48px 80px;
      backdrop-filter: blur(16px);
      box-shadow: var(--theme-glow);
      min-width: 620px;
    }
    h1 { font-size: 50px; font-weight: 800; color: var(--color-accent-cyan); margin: 0 0 10px 0; }
    .starting-countdown {
      font-size: 60px;
      font-weight: 800;
      color: var(--color-accent-orange);
      margin: 18px 0 10px 0;
      letter-spacing: 2px;
      font-family: var(--font-tech);
    }
    .tech-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid var(--color-border-dim, rgba(255,255,255,0.15));
    }
    .tech-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-accent-cyan, #57D6C4), var(--color-accent-orange, #FF783F));
      border-radius: 4px;
      transition: width 1s linear;
      box-shadow: 0 0 10px var(--color-accent-cyan, #57D6C4);
    }
  </style>
</head>
<body data-theme="latte_caramel">
  <div class="card">
    <div style="font-size:38px; margin-bottom:10px;">☕ ✨</div>
    <h1 class="main-stream-title">EL DIRECTO COMIENZA EN BREVE</h1>
    <p class="stream-subtitle" style="color:var(--color-text-dim); font-size:18px;">Ponte cómodo/a, prepárate un té o café.</p>
    <div class="starting-countdown">05:00</div>
    <div class="tech-progress-bar">
      <div class="tech-progress-fill"></div>
    </div>
  </div>
  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
