<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Empezamos en breve (Cozy)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: radial-gradient(circle at center, #2C211B 0%, var(--color-bg-dark, #1A1512) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', 'Comfortaa', var(--font-primary), sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Partículas de luz ambiente flotante */
    .warm-card {
      text-align: center;
      background: var(--color-panel-bg, rgba(48, 38, 30, 0.9));
      backdrop-filter: var(--panel-backdrop, blur(20px));
      border: 1.5px solid var(--color-border-cyan, rgba(196, 130, 67, 0.28));
      border-radius: 36px;
      padding: 56px 84px;
      box-shadow: 0 24px 60px rgba(20, 15, 10, 0.35);
      min-width: 680px;
      position: relative;
      overflow: hidden;
    }

    .steam-container {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
      position: relative;
    }

    @keyframes steamFloat {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      40% { opacity: 0.7; }
      100% { transform: translateY(-24px) scaleX(1.4); opacity: 0; }
    }

    .steam-vapor {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      animation: steamFloat 2.8s infinite ease-out;
    }

    h1 {
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: 44px;
      font-weight: 700;
      color: var(--color-text-light, #FDFBF7);
      margin: 8px 0 10px 0;
    }

    p {
      font-size: 16px;
      color: var(--color-text-dim, #B3A091);
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    .starting-countdown {
      font-size: 68px;
      font-weight: 700;
      color: var(--color-accent-cyan, #C48243);
      font-family: 'Comfortaa', cursive, sans-serif;
      margin: 12px 0;
      letter-spacing: 4px;
    }

    .cozy-progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      overflow: hidden;
      margin-top: 18px;
    }

    .cozy-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-accent-cyan, #C48243), var(--color-accent-orange, #E0C097));
      border-radius: 50px;
      transition: width 1s linear;
    }

    .social-pills-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 32px;
    }

    .social-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--color-text-light, #FDFBF7);
    }
  </style>
</head>
<body data-pack="Cozy_LoFi_Pack" data-scene="cozy_starting" data-theme="lavender_dream">

  <div class="panel-card warm-card" data-oss-panel="true">
    <div class="steam-container">
      <span class="steam-vapor">♨️</span>
      <span>☕</span>
    </div>

    <h1 class="main-stream-title" data-text-key="startingSoon.title">EL STREAM EMPIEZA PRONTO</h1>
    <p class="stream-subtitle" data-text-key="startingSoon.subtitle">Preparando una taza caliente y encendiendo luces. Ponte cómodo ✨</p>

    <div class="starting-countdown" id="startingCountdown">05:00</div>

    <div class="cozy-progress-bar">
      <div class="cozy-progress-fill starting-progress-bar" id="startingProgressBar"></div>
    </div>

    <div class="social-pills-row">
      <span class="social-pill" data-text-key="channel.name">🟣 twitch.tv/andorina</span>
      <span class="social-pill">💬 discord.gg/comunidad</span>
      <span class="social-pill" data-text-key="channel.tagline">✨ relax & chill</span>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
  <script>
    (function() {
      let totalSeconds = 300;
      let remaining = totalSeconds;
      const countEl = document.getElementById('startingCountdown');
      const barEl = document.getElementById('startingProgressBar');
      setInterval(() => {
        if (remaining > 0) {
          remaining--;
          const m = String(Math.floor(remaining / 60)).padStart(2, '0');
          const s = String(remaining % 60).padStart(2, '0');
          if (countEl) countEl.textContent = `${m}:${s}`;
          if (barEl) barEl.style.width = `${((totalSeconds - remaining) / totalSeconds) * 100}%`;
        }
      }, 1000);
    })();
  </script>
</body>
</html>
