<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Pausa de Café</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-primary);
    }
    .card {
      text-align: center;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-cyan);
      border-radius: 20px;
      padding: 44px 74px;
      box-shadow: var(--theme-glow);
    }
    h1 { font-size: 46px; color: var(--color-accent-cyan); margin: 0; }
  </style>
</head>
<body data-theme="latte_caramel">
  <div class="card">
    <div style="font-size:36px; margin-bottom:8px;">☕</div>
    <h1 class="main-stream-title">PAUSA DE CAFÉ</h1>
    <p class="stream-subtitle brb-status-phrase" style="color:var(--color-text-dim); margin-top:8px;">Descanso de 5 minutos. ¡Enseguida volvemos!</p>
  </div>
  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
