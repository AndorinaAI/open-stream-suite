<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_700.woff2">

<!-- /preload-fonts:T4 -->
  <title>Pantalla — Pausa de Café (Coffee Break)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: radial-gradient(circle at center, #2C211B 0%, var(--color-bg-dark, #1A1512) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', 'Comfortaa', var(--font-primary), sans-serif;
      overflow: hidden;
    }

    .break-card {
      text-align: center;
      background: var(--color-panel-bg, rgba(48, 38, 30, 0.9));
      backdrop-filter: var(--panel-backdrop, blur(20px));
      border: 1.5px solid var(--color-border-cyan, rgba(196, 130, 67, 0.28));
      border-radius: 36px;
      padding: 56px 84px;
      box-shadow: 0 24px 60px rgba(20, 15, 10, 0.35);
      min-width: 680px;
      position: relative;
    }

    @keyframes steamFloat {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      40% { opacity: 0.7; }
      100% { transform: translateY(-24px) scaleX(1.4); opacity: 0; }
    }

    .steam-vapor {
      font-size: 32px;
      animation: steamFloat 2.8s infinite ease-out;
      display: block;
      margin-bottom: -10px;
    }

    .mug-icon {
      font-size: 54px;
      margin-bottom: 14px;
      display: inline-block;
    }

    h1 {
      font-family: 'Comfortaa', cursive, sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--color-text-light, #FDFBF7);
      margin: 6px 0 12px 0;
    }

    p {
      font-size: 16px;
      color: var(--color-text-dim, #B3A091);
      margin: 0 0 24px 0;
      line-height: 1.6;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Píldora de respiración relajante */
    @keyframes breatheCircle {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .relax-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(196, 130, 67, 0.16);
      border: 1px solid var(--color-border-cyan, rgba(196, 130, 67, 0.3));
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-accent-orange, #E0C097);
      animation: breatheCircle 4s infinite ease-in-out;
    }

    .social-pills-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
    }

    .social-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--color-text-light, #FDFBF7);
    }
  </style>
</head>
<body data-pack="Cozy_LoFi_Pack" data-scene="cozy_brb" data-theme="latte_caramel">

  <div class="panel-card break-card" data-oss-panel="true">
    <div>
      <span class="steam-vapor">♨️</span>
      <span class="mug-icon">☕</span>
    </div>

    <h1 class="main-stream-title" data-text-key="beRightBack.title">PAUSA DE CAFÉ</h1>
    <p class="stream-subtitle brb-status-phrase" data-text-key="beRightBack.subtitle">Pausa para rellenar la taza y estirar las piernas. ¡Regresamos en unos minutos!</p>

    <div class="mode-badge relax-pill" data-oss-badge="true">
      <span>🌿</span>
      <span data-text-key="channel.tagline">Inhala profundo · Exhala lento · Descanso activo</span>
    </div>

    <div class="social-pills-row">
      <span class="social-pill" data-text-key="channel.name">🟣 twitch.tv/andorina</span>
      <span class="social-pill">💬 discord.gg/comunidad</span>
    </div>
  </div>

  <script src="/config.js"></script>
  <!-- Módulos críticos cargados antes del primer pintado: evita que el DOM se
       complete después y que los elementos se recoloquen (T4-seguimiento). -->
  <script src="/common/overlay/icons.js?v=50"></script>
  <script src="/common/overlay/dom-injector.js?v=50"></script>
  <script src="/common/overlay/interactive-features.js?v=50"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
