<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Open Stream Suite — CHILL CHARLA</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <link rel="stylesheet" href="/common/components.css">
  <style>
    /* Estilos específicos para la escena de charla */
    .camera-chill-main {
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
    }

    .cam-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .chat-panel-frame {
      position: absolute;
      top: 112px;
      left: 1344px;
      width: 544px;
      height: 848px;
      border: 1px solid var(--color-border-dim);
      border-radius: var(--radius-sm);
      background: rgba(25, 29, 33, 0.4);
      backdrop-filter: var(--panel-backdrop, blur(10px));
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      z-index: 50;
      pointer-events: auto;
    }

    .chat-panel-header {
      height: 42px;
      border-bottom: 1px solid var(--color-border-dim);
      background: var(--color-panel-bg-trans);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .chat-title {
      font-family: var(--font-tech);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--color-accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-status-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10B981;
    }

    .chat-content-viewport {
      flex: 1;
      background: transparent;
    }

    .chill-footer-topic {
      position: absolute;
      top: 906px;
      left: 32px;
      width: 1280px;
      height: 54px;
      background: var(--color-panel-bg-trans);
      backdrop-filter: var(--panel-backdrop, blur(10px));
      border: 1px solid var(--color-border-dim);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
    }
  </style>
</head>
<body data-pack="Maker_Theme_Pack" data-scene="chill" data-theme="chill" data-mode="chill">
  <div class="overlay-canvas">

    <!-- 1. Cabecera superior -->
    <header class="header-bar scene-header theme-chill" data-oss-bar="top">
      <div class="header-left">
        <div class="mode-badge badge-chill" data-oss-badge="true">
          <span data-icon="chat"></span>
          <span>CHILL MODE</span>
        </div>
        <div class="header-subtitle" data-text-key="chill.subtitle">CHARLA / DUDAS / IDEAS / COMUNIDAD</div>
      </div>
      <div class="header-right">
        <div class="brand-badge">
          <div class="brand-icon-svg" data-icon="logo"></div>
          <div class="brand-info">
            <span class="brand-name" data-text-key="channel.name">ANDORINA</span>
            <span class="brand-tagline" data-text-key="channel.tagline">JUGAR · CREAR · TRASTEAR</span>
          </div>
        </div>
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span data-i18n="themes.live_indicator" data-text-key="channel.liveText">EN DIRECTO</span>
        </div>
      </div>
    </header>

    <!-- 2. Cámara Principal de Charla (1280 x 720) -->
    <div class="camera-frame camera-chill-main camera-main" data-oss-cam="true" style="top: 112px; left: 32px; width: 1280px; height: 720px; border-color: rgba(137, 180, 250, 0.4);">
      <div class="cam-viewport" data-oss-viewport="true"></div>
      <div class="cam-label frame-label" data-oss-cam-label="true" style="border-color: rgba(137, 180, 250, 0.4); color: #89B4FA;" data-text-key="chill.chatTitle">
        <span data-icon="chat" style="width:12px;height:12px;display:flex;"></span>
        <span>JUST CHATTING / CÁMARA PRINCIPAL</span>
      </div>
      <div class="frame-corner-tr" style="border-color: #89B4FA;"></div>
      <div class="frame-corner-bl" style="border-color: #89B4FA;"></div>
      <div class="reg-mark" style="top: 8px; right: 10px; color: #89B4FA;">⌖</div>
    </div>

    <!-- 3. Marco de Chat lateral (544 x 848) -->
    <div class="panel-card chat-panel-frame" data-oss-panel="true">
      <div class="chat-panel-header">
        <div class="chat-title">
          <span class="chat-status-dot"></span>
          <span data-text-key="chill.chatTitle">CHAT EN DIRECTO</span>
        </div>
        <span style="font-family: var(--font-tech); font-size: 10px; color: var(--color-text-dim);">TWITCH / OBS</span>
      </div>
      <div class="chat-content-viewport">
        <!-- Contenido de chat de Twitch -->
      </div>
    </div>

    <!-- 4. Banda inferior informativa de la charla -->
    <footer class="footer-bar chill-footer-topic" data-oss-bar="bottom">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-family: var(--font-tech); font-size: 11px; color: var(--color-text-dim); font-weight: 700;">TEMA:</span>
        <span style="font-family: var(--font-primary); font-size: 14px; font-weight: 600; color: var(--color-text-light);" data-text-key="chill.podcastTitle">Cacharreo, proyectos de la semana y preguntas del chat</span>
      </div>
      <div style="font-family: var(--font-tech); font-size: 11px; color: var(--color-accent-cyan);" data-text-key="chill.chatStatus">
        ¡Escribe en el chat para participar!
      </div>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
