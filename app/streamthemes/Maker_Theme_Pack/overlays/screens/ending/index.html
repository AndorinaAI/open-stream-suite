<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Open Stream Suite — ENDING</title>
  <link rel="stylesheet" href="../../../common/styles.css">
  <link rel="stylesheet" href="../../../common/themes.css">
  <link rel="stylesheet" href="../../../common/components.css">
  <style>
    /* Estilos de despedida (Ending) */
    .ending-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      z-index: 20;
    }

    .ending-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ending-center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto;
    }

    .ending-farewell-card {
      margin-top: 36px;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-dim);
      border-radius: var(--radius-md);
      padding: 24px 40px;
      max-width: 640px;
      backdrop-filter: blur(8px);
    }

    .ending-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--color-border-dim);
      padding-top: 20px;
    }
  </style>
</head>
<body class="fullscreen-scene">
  <div class="overlay-canvas">
    <div class="tech-grid-overlay"></div>

    <div class="ending-container">
      
      <!-- Barra superior -->
      <div class="ending-top-bar">
        <div class="brand-badge" style="transform: scale(1.15); transform-origin: left center;">
          <div class="brand-icon-svg" data-icon="logo" style="width: 32px; height: 32px;"></div>
          <div class="brand-info">
            <span class="brand-name" style="font-size: 20px;">ANDORINA</span>
            <span class="brand-tagline" style="font-size: 11px;">JUGAR · CREAR · TRASTEAR</span>
          </div>
        </div>
        <div class="live-indicator" style="background: rgba(139, 150, 156, 0.1); border-color: rgba(139, 150, 156, 0.3); color: var(--color-text-dim);">
          <span style="width: 7px; height: 7px; background: var(--color-text-dim); border-radius: 50%;"></span>
          <span data-i18n="themes.placeholder_end_status">FIN DE TRANSMISIÓN</span>
        </div>
      </div>

      <!-- Centro de la escena -->
      <div class="ending-center-content">
        <h1 class="main-stream-title" style="font-size: 76px;" data-i18n="themes.placeholder_end_title">
          GRACIAS POR PASARTE
        </h1>
        <p class="stream-subtitle" style="font-size: 20px; color: var(--color-accent-cyan);" data-i18n="themes.placeholder_end_sub">
          NOS VEMOS EN EL PRÓXIMO DIRECTO
        </p>

        <!-- Tarjeta de despedida -->
        <div class="ending-farewell-card">
          <p style="font-family: var(--font-primary); font-size: 16px; color: var(--color-text-light); line-height: 1.6;" data-i18n="overlays.thanks_stream">
            ¡Gracias por acompañar el stream! Recuerda seguir el canal para no perderte el próximo directo.
          </p>
          <div style="margin-top: 20px; font-family: var(--font-tech); font-size: 12px; color: var(--color-accent-orange); letter-spacing: 1.5px;" data-i18n="themes.placeholder_end_tag">
            // SIGUE TRASTEANDO Y CREANDO
          </div>
        </div>
      </div>

      <!-- Barra inferior -->
      <div class="ending-footer">
        <div style="font-family: var(--font-tech); font-size: 12px; color: var(--color-text-dim);" data-i18n="themes.placeholder_end_footer">
          ANDORINA · OPEN STREAM SUITE · TRANSMISIÓN FINALIZADA
        </div>
        <div class="social-links" style="display: none;"></div>
      </div>

    </div>
  </div>

  <script src="../../../config.js"></script>
  <script src="../../../common/overlay.js"></script>
</body>
</html>
