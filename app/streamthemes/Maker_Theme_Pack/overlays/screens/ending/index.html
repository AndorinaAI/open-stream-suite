<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<!-- preload-fonts:T4 (generado por scripts/apply_font_preloads.py) -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/fira_code_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/fira_code_normal_600.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/inter_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/inter_normal_800.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_700.woff2">
<!-- /preload-fonts:T4 -->
  <title>Open Stream Suite — ENDING</title>
  <link rel="stylesheet" href="/common/fonts.css">
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/generated/archetypes.css">
  <link rel="stylesheet" href="/common/generated/shapes.css">
  <link rel="stylesheet" href="/common/themes.css">
  <link rel="stylesheet" href="/common/components.css">
  <link rel="stylesheet" href="/common/oss-skin.css">
  <style>
    /* Estilos de despedida (Ending) */
    .ending-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      z-index: 20;
      box-sizing: border-box;
    }

    .ending-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ending-center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto;
    }

    .ending-farewell-card {
      margin-top: 36px;
      background: var(--color-panel-bg-trans);
      border: 1px solid var(--color-border-dim);
      border-radius: var(--radius-md);
      padding: 24px 40px;
      max-width: 640px;
      backdrop-filter: var(--panel-backdrop, blur(10px));
    }

    .ending-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--color-border-dim);
      padding-top: 20px;
    }
  </style>
</head>
<body class="fullscreen-scene" data-pack="Maker_Theme_Pack" data-scene="ending" data-theme="synthwave">
  <div class="overlay-canvas">
    <div class="tech-grid-overlay"></div>

    <div class="ending-container">
      
      <!-- Barra superior -->
      <header class="header-bar ending-top-bar" data-oss-bar="top">
        <div class="brand-badge" style="transform: scale(1.15); transform-origin: left center;">
          <div class="brand-icon-svg" data-icon="logo" style="width: 32px; height: 32px;"></div>
          <div class="brand-info">
            <span class="brand-name" style="font-size: 20px;" data-text-key="channel.name">ANDORINA</span>
            <span class="brand-tagline" style="font-size: 11px;" data-text-key="channel.tagline">JUGAR · CREAR · TRASTEAR</span>
          </div>
        </div>
        <div class="live-indicator" style="background: rgba(139, 150, 156, 0.1); border-color: rgba(139, 150, 156, 0.3); color: var(--color-text-dim);">
          <span style="width: 7px; height: 7px; background: var(--color-text-dim); border-radius: 50%;"></span>
          <span data-i18n="themes.placeholder_end_status" data-text-key="ending.liveStatusText">FIN DE TRANSMISIÓN</span>
        </div>
      </header>

      <!-- Centro de la escena -->
      <div class="ending-center-content">
        <h1 class="main-stream-title" style="font-size: 76px;" data-text-key="ending.title">
          GRACIAS POR PASARTE
        </h1>
        <p class="stream-subtitle" style="font-size: 20px; color: var(--color-accent-cyan);" data-text-key="ending.subtitle">
          NOS VEMOS EN EL PRÓXIMO DIRECTO
        </p>

        <!-- Tarjeta de despedida -->
        <div class="panel-card ending-farewell-card" data-oss-panel="true">
          <p style="font-family: var(--font-primary); font-size: 16px; color: var(--color-text-light); line-height: 1.6;" data-text-key="ending.credits.0">
            ¡Gracias por acompañar el stream! Recuerda seguir el canal para no perderte el próximo directo.
          </p>
          <div style="margin-top: 20px; font-family: var(--font-tech); font-size: 12px; color: var(--color-text-light, #F7EFE6); letter-spacing: 1.5px;" data-text-key="ending.badgeText">
            // SIGUE TRASTEANDO Y CREANDO
          </div>
        </div>
      </div>

      <!-- Barra inferior -->
      <footer class="footer-bar ending-footer" data-oss-bar="bottom">
        <div style="font-family: var(--font-tech); font-size: 12px; color: var(--color-text-dim);" data-text-key="channel.tagline">
          ANDORINA · OPEN STREAM SUITE · TRANSMISIÓN FINALIZADA
        </div>
        <div class="social-links" style="display: none;"></div>
      </footer>

    </div>
  </div>

  <script src="/config.js"></script>
  <!-- Módulos críticos cargados antes del primer pintado: evita que el DOM se
       complete después y que los elementos se recoloquen (T4-seguimiento). -->
  <script src="/common/overlay/icons.js?v=50"></script>
  <script src="/common/overlay/dom-injector.js?v=50"></script>
  <script src="/common/overlay/interactive-features.js?v=50"></script>
  <script src="/common/oss-skin.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
