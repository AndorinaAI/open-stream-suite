<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla — Calentamiento / Lobby</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: var(--color-bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-tech);
    }
    .box {
      border: 2px solid var(--color-accent-cyan);
      padding: 40px 80px;
      background: var(--color-panel-bg);
      clip-path: polygon(20px 0, 100% 0, calc(100% - 20px) 100%, 0 100%);
      box-shadow: var(--theme-glow);
      text-align: center;
    }
    h1 { font-size: 54px; color: var(--color-accent-cyan); margin: 0 0 12px 0; }
  </style>
</head>
<body data-theme="crimson_esport">
  <div class="box">
    <h1>MATCH INCOMING</h1>
    <p style="color:var(--color-text-dim); font-size:18px;">CONECTANDO CON EL SERVIDOR DE PARTIDA...</p>
  </div>
  <script src="/config.js"></script>
</body>
</html>
