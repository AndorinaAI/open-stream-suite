<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gamer Pro — Tactical Timeout & Halftime Break</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 40px 60px;
      box-sizing: border-box;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-family: var(--font-tech, 'JetBrains Mono', 'Segoe UI', monospace);
      color: #f8fafc;
    }

    /* Top Bar */
    .timeout-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid var(--color-accent-orange, #ff783f);
      clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      padding: 12px 32px;
    }
    .timeout-badge {
      background: var(--color-accent-orange, #ff783f);
      color: #0b0f19;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 4px 12px;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }

    /* Main Stage */
    .timeout-center-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }
    .timeout-card {
      width: 900px;
      background: rgba(10, 15, 26, 0.88);
      border: 2px solid var(--color-accent-orange, #ff783f);
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
      padding: 48px 56px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      text-align: center;
    }
    .corner-reticle {
      position: absolute;
      font-size: 14px;
      color: var(--color-accent-cyan, #57d6c4);
      font-weight: 900;
    }
    .timeout-header-tag {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--color-accent-cyan, #57d6c4);
      margin-bottom: 8px;
    }
    .main-stream-title {
      font-size: 52px;
      font-weight: 900;
      margin: 0 0 14px 0;
      letter-spacing: 2px;
      color: #fff;
    }
    .stream-subtitle {
      font-size: 18px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .halftime-scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 32px;
      margin: 0 auto;
      width: fit-content;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }
    .team-score {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      font-family: monospace;
    }
    .score-divider {
      font-size: 20px;
      color: var(--color-accent-orange, #ff783f);
      font-weight: 900;
    }

    /* Bottom Bar */
    .timeout-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 26, 0.88);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 32px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body data-theme="crimson_esport">
  <!-- Top Bar -->
  <header class="timeout-top-bar">
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="timeout-badge">TACTICAL TIMEOUT</div>
      <div style="font-size:12px; font-weight:700; color:#cbd5e1;">HALFTIME // PAUSA TÁCTICA DEL EQUIPO</div>
    </div>
    <div style="font-size:12px; font-weight:700; color:var(--color-accent-cyan, #57d6c4);">
      REANUDACIÓN INMINENTE
    </div>
  </header>

  <!-- Main Stage -->
  <main class="timeout-center-stage">
    <div class="timeout-card">
      <div class="corner-reticle" style="top:12px; left:14px;">[+]</div>
      <div class="corner-reticle" style="bottom:12px; right:14px;">[+]</div>
      <div class="timeout-header-tag">// TIEMPO MUERTO SOLICITADO</div>
      <h1 class="main-stream-title">PAUSA TÁCTICA</h1>
      <p class="stream-subtitle brb-status-phrase">RECARGANDO ENERGÍA Y AJUSTANDO LA ESTRATEGIA...</p>

      <div class="halftime-scoreboard">
        <div>
          <div style="font-size:10px; color:#94a3b8; font-weight:800;">TEAM BLUE</div>
          <div class="team-score" style="color:var(--color-accent-cyan, #57d6c4);">12</div>
        </div>
        <div class="score-divider">VS</div>
        <div>
          <div style="font-size:10px; color:#94a3b8; font-weight:800;">OPPONENT</div>
          <div class="team-score" style="color:#ef4444;">09</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Bar -->
  <footer class="timeout-bottom-bar">
    <div>SISTEMA DE PARTIDA COMPETITIVA // SPRINT FINAL</div>
    <div>SÍGUENOS: <strong style="color:#f1f5f9;">@ProGamerLive</strong> · CHAT ACTIVO</div>
  </footer>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
