<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay — Gameplay HUD Pro (Esports)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 28px 36px;
      box-sizing: border-box;
      background: transparent;
      overflow: hidden;
      position: relative;
      font-family: 'Share Tech Mono', var(--font-tech), monospace;
    }

    /* Barra Superior de Telemetría Táctica */
    .tactical-telemetry-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 16, 20, 0.92);
      border: 1.5px solid var(--color-accent-cyan, #00F0FF);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      padding: 8px 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 0 16px rgba(0, 240, 255, 0.12);
    }

    .telemetry-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-match-chip {
      background: var(--color-accent-cyan, #00F0FF);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 10px;
      letter-spacing: 1px;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes pulseRec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      background: #000;
      border-radius: 50%;
      animation: pulseRec 1.2s infinite;
    }

    .telemetry-items {
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: var(--color-text-dim, #8B96A0);
    }

    .tel-val {
      color: #FFF;
      font-weight: 700;
    }

    .tel-highlight {
      color: var(--color-accent-cyan, #00F0FF);
      font-weight: 800;
    }

    /* Caja de Cámara Táctica Angulada */
    .hud-cam-box {
      position: absolute;
      top: 90px;
      right: 36px;
      width: 440px;
      height: 250px;
      background: rgba(10, 12, 16, 0.4);
      border: 2px solid var(--color-accent-cyan, #00F0FF);
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
      box-shadow: 0 12px 36px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .cam-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Retículas y Marcadores de Esquina */
    .reticle-tl {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 14px;
      height: 14px;
      border-top: 2px solid #FFF;
      border-left: 2px solid #FFF;
      z-index: 10;
      pointer-events: none;
    }

    .reticle-br {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 14px;
      height: 14px;
      border-bottom: 2px solid #FFF;
      border-right: 2px solid #FFF;
      z-index: 10;
      pointer-events: none;
    }

    .cam-header-tag {
      position: absolute;
      top: 10px;
      left: 14px;
      background: #0E1216;
      border: 1px solid var(--color-accent-cyan, #00F0FF);
      color: var(--color-accent-cyan, #00F0FF);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 12px;
      letter-spacing: 1px;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      z-index: 12;
    }

    .cam-footer-tag {
      position: absolute;
      bottom: 10px;
      right: 14px;
      background: #0E1216;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FFF;
      font-size: 11px;
      padding: 1px 10px;
      z-index: 12;
    }

    /* Barra Inferior Izquierda: Redes / Sponsor */
    .bottom-hud-bar {
      position: absolute;
      bottom: 28px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(14, 16, 20, 0.94);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-left: 4px solid var(--color-accent-cyan, #00F0FF);
      padding: 8px 20px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .hud-rank-badge {
      background: rgba(0, 240, 255, 0.15);
      color: var(--color-accent-cyan, #00F0FF);
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 2px;
    }
  </style>
</head>
<body data-pack="Gamer_Pro_Pack" data-scene="gamer_gameplay" data-theme="cyber_glitch">

  <!-- Telemetría Superior Táctica -->
  <header class="header-bar tactical-telemetry-bar" data-oss-bar="top">
    <div class="telemetry-left">
      <div class="mode-badge live-match-chip" data-oss-badge="true" data-text-key="game.badgeText">
        <span class="rec-dot"></span>
        <span>LIVE MATCH // ESPORTS</span>
      </div>
      <span class="hud-rank-badge" data-text-key="game.tagline">🏆 APEX MASTER RANK</span>
    </div>

    <div class="telemetry-items">
      <span>FPS: <b class="tel-val">240</b></span>
      <span>PING: <b class="tel-val">14ms</b></span>
      <span>K/D: <b class="tel-highlight">4.82</b></span>
      <span>WIN STREAK: <b class="tel-highlight">5 🔥</b></span>
      <span>RESOLUCIÓN: <b class="tel-val">1080p 60FPS</b></span>
    </div>
  </header>

  <!-- Marco de Webcam Táctico -->
  <div class="camera-frame hud-cam-box camera-face" data-oss-cam="true">
    <div class="reticle-tl"></div>
    <div class="reticle-br"></div>
    <div class="cam-viewport" data-oss-viewport="true"></div>
    <div class="cam-label cam-header-tag" data-oss-cam-label="true" data-text-key="game.camLabel">HUD // CAM 01 [ONLINE]</div>
    <div class="cam-footer-tag">FPS: 60 · 1920×1080</div>
  </div>

  <!-- Barra Inferior -->
  <footer class="footer-bar bottom-hud-bar" data-oss-bar="bottom">
    <span style="color: var(--color-accent-cyan);">🎯 OBJETIVO:</span>
    <span style="color: #FFF; font-weight: 700;" data-text-key="channel.tagline">Subir a Top 500 Regional</span>
    <span style="color: rgba(255,255,255,0.2);">|</span>
    <span style="color: var(--color-text-dim);" data-text-key="channel.name">🟣 twitch.tv/andorina · @andorina</span>
  </footer>

  <script src="/config.js"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
