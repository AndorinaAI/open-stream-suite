<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<!-- preload-fonts:T4 (generado por scripts/apply_font_preloads.py) -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/fira_code_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/fira_code_normal_700.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/jetbrains_mono_normal_700.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/share_tech_mono_normal_400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/common/fonts/teko_normal_700.woff2">
<!-- /preload-fonts:T4 -->
  <title>Overlay — Victoria & Clutch Showcase (Esports)</title>
  <link rel="stylesheet" href="/common/styles.css">
  <link rel="stylesheet" href="/common/themes.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 36px 48px;
      box-sizing: border-box;
      background: radial-gradient(circle at center, rgba(245, 158, 11, 0.15) 0%, rgba(10, 12, 16, 0.95) 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: 'Share Tech Mono', var(--font-tech), monospace;
      overflow: hidden;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.6)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 45px rgba(245, 158, 11, 0.9)); transform: scale(1.015); }
    }

    /* Marco de Cámara del Ganador (Spotlight Live Cam) */
    .winner-cam-frame {
      width: 680px;
      height: 380px;
      background: #0A0D10;
      border: 2.5px solid var(--color-accent-orange, #F59E0B);
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
      box-shadow: 0 16px 45px rgba(0,0,0,0.8), inset 0 0 24px rgba(245, 158, 11, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .cam-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .cam-label {
      position: absolute;
      top: 10px;
      left: 14px;
      background: #0E1216;
      border: 1px solid var(--color-accent-orange, #F59E0B);
      color: var(--color-accent-orange-text, var(--color-accent-orange, #F59E0B));
      font-size: 11px;
      font-weight: 800;
      padding: 3px 14px;
      letter-spacing: 1px;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      z-index: 10;
    }

    /* Retículas */
    .reticle-tl {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 14px;
      height: 14px;
      border-top: 2px solid #FFF;
      border-left: 2px solid #FFF;
      z-index: 5;
    }

    .reticle-br {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 14px;
      height: 14px;
      border-bottom: 2px solid #FFF;
      border-right: 2px solid #FFF;
      z-index: 5;
    }

    /* Podio de Victoria */
    .victory-podium {
      text-align: center;
      background: rgba(14, 18, 24, 0.94);
      border: 2px solid var(--color-accent-orange, #F59E0B);
      clip-path: polygon(0 0, calc(100% - 32px) 0, 100% 32px, 100% 100%, 32px 100%, 0 calc(100% - 32px));
      padding: 32px 64px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      animation: pulseGlow 3s infinite ease-in-out;
      width: 880px;
      box-sizing: border-box;
    }

    .podium-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .trophy-icon {
      font-size: 54px;
      display: inline-block;
    }

    .victory-banner {
      font-family: 'Teko', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--color-accent-orange-text, var(--color-accent-orange, #F59E0B));
      letter-spacing: 4px;
      margin: 0;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(245, 158, 11, 0.5);
    }

    .clutch-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--color-accent-orange, #F59E0B);
      color: #FFF;
      font-size: 13px;
      font-weight: 800;
      padding: 5px 22px;
      letter-spacing: 2px;
      margin: 12px 0 18px 0;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    }

    .match-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 14px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      color: var(--color-text-dim, #8B96A0);
      margin-bottom: 2px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 800;
      color: #FFF;
      font-family: 'Teko', sans-serif;
    }
  </style>
</head>
<body data-pack="Gamer_Pro_Pack" data-scene="gamer_victory" data-theme="golden_glory">

  <!-- Marco de Cámara de Reacción del Ganador -->
  <div class="camera-frame winner-cam-frame camera-main" data-oss-cam="true">
    <div class="reticle-tl"></div>
    <div class="reticle-br"></div>
    <div class="cam-viewport" data-oss-viewport="true"></div>
    <div class="cam-label" data-oss-cam-label="true" data-text-key="victory.camLabel">CHAMPION // REACTION FEED</div>
  </div>

  <!-- Podio de Victoria -->
  <div class="panel-card victory-podium" data-oss-panel="true">
    <div class="podium-top">
      <div class="trophy-icon">🏆</div>
      <h1 class="victory-banner" data-text-key="victory.title">VICTORIA & CLUTCH CHAMPION</h1>
    </div>

    <div class="mode-badge clutch-badge" data-oss-badge="true" data-text-key="victory.subtitle">⚡ 1v4 CLUTCH CONQUERED · MATCH MVP</div>

    <div class="match-stats-grid">
      <div class="stat-box">
        <div class="stat-label">ELIMINACIONES</div>
        <div class="stat-number" style="color: #F59E0B;">18 KILLS</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">DAÑO TOTAL</div>
        <div class="stat-number">4,920 DMG</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">HEADSHOTS</div>
        <div class="stat-number" style="color: #10B981;">68% ACC</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">PUNTOS RANGO</div>
        <div class="stat-number" style="color: #38BDF8;">+350 RP</div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <!-- Módulos críticos cargados antes del primer pintado: evita que el DOM se
       complete después y que los elementos se recoloquen (T4-seguimiento). -->
  <script src="/common/overlay/icons.js?v=50"></script>
  <script src="/common/overlay/dom-injector.js?v=50"></script>
  <script src="/common/overlay/interactive-features.js?v=50"></script>
  <script src="/common/overlay.js"></script>
</body>
</html>
