<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Open Stream Suite — Widget de Alertas y Triggers (OBS)</title>
  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="../common/themes.css">
  <link rel="stylesheet" href="../common/components.css">
  <link rel="stylesheet" href="css/alerts-themes.css?v=2">
  <link rel="stylesheet" href="css/alerts-widget.css">
</head>
<body>
  <div class="alerts-stage">
    
    <!-- Alerta tipo Banner / Tarjeta Maker Tradicional -->
    <div id="alert-card" class="alert-box">
      <div class="alert-corner-tr"></div>
      <div class="alert-corner-bl"></div>

      <div id="alert-icon" class="alert-icon-wrapper">
        <!-- Icono SVG inyectado -->
      </div>
      <div class="alert-content">
        <span id="alert-title" class="alert-type-title">¡NUEVO SEGUIDOR!</span>
        <span id="alert-user" class="alert-username">NombreDeUsuario</span>
        <span id="alert-msg" class="alert-message">Bienvenido al stream</span>
      </div>
    </div>

    <!-- Creador de Alertas por Banner Procedural (Moderno y Personalizable) -->
    <div id="banner-alert-root" class="banner-alert-root" style="display: none;">
      <div id="banner-icon-container" class="banner-icon-box">
        <!-- SVG Icono del evento -->
      </div>
      <div class="banner-text-col">
        <div id="banner-alert-badge" class="banner-badge-tag">NUEVA ALERTA</div>
        <div id="banner-alert-title" class="banner-primary-title">¡GRACIAS POR EL APOYO!</div>
        <div id="banner-alert-user" class="banner-user-display">Usuario</div>
        <div id="banner-alert-msg" class="banner-subtitle-msg"></div>
      </div>
    </div>

    <!-- Contenedor para Triggers de Vídeo / Memes / GIFs (TriggerFyre) -->
    <div id="trigger-container" class="trigger-media-container">
      <video id="trigger-video" class="trigger-video-element" playsinline></video>
      <img id="trigger-image" class="trigger-video-element" style="display: none;" alt="Trigger Media">
      <div id="trigger-caption" class="trigger-caption-banner" style="display: none;"></div>
    </div>

    <!-- Lienzo de Efectos y Partículas (Explosión de Emoticonos) -->
    <canvas id="fx-canvas" style="position: absolute; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%;"></canvas>

    <!-- Indicador de conexión sutil -->
    <div id="ws-indicator" class="ws-status-indicator">WS OK</div>
  </div>

  <!-- Submódulos del Motor de Alertas para OBS -->
  <script src="js/overlay/01-audio-engine.js"></script>
  <script src="js/overlay/02-particle-engine.js"></script>
  <script src="js/overlay/03-alert-queue.js"></script>
  <script src="js/overlay/04-ws-client.js"></script>
</body>
</html>
