name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Thanks for your first issue! 🎉 We will review it soon. / ¡Gracias por tu primer issue! Lo revisaremos pronto."
          pr-message: "Thanks for your first PR! 🚀 We will review it soon. / ¡Gracias por tu primer PR! Lo revisaremos pronto."
