name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp websockets requests Pillow
      - name: Tests
        working-directory: app
        run: python -m unittest discover tests -v

  generated-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerar el motor de apariencia
        working-directory: app
        run: python scripts/build_theme_engine.py
      - name: Los generados deben coincidir con el manifiesto
        run: |
          if [ -n "$(git status --porcelain -- app/common/generated)" ]; then
            echo "::error::app/common/generated esta desactualizado respecto al manifiesto."
            echo "Ejecuta: cd app && python scripts/build_theme_engine.py"
            git --no-pager diff -- app/common/generated
            exit 1
          fi
      - name: El CSS de los temas debe salir de theme.json
        working-directory: app
        run: python scripts/regenerate_themes.py --check
      - name: Todas las vistas cargan el mismo bloque de CSS
        working-directory: app
        run: python scripts/normalize_view_links.py --check
      - name: Los presets de widget no llevan aspecto
        working-directory: app
        run: python scripts/migrate_theme_unification.py --check
      - name: Cada widget cumple el contrato (dianas, config, modulo)
        working-directory: app
        run: python scripts/check_widget_contract.py

  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = 0
          for p in pathlib.Path('.').rglob('*.json'):
              if any(x in p.parts for x in ('venv', '.git', 'node_modules')):
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print('JSON inválido:', p, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
