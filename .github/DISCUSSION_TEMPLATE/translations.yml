title: "[i18n]: "
labels: ["i18n", "localization"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🌍 Missing Translation Report / Reporte de Traducción Faltante
        Thank you for helping keep Open Stream Suite localized and typo-free! / *¡Gracias por ayudarnos a que Open Stream Suite esté disponible en más idiomas y sin errores de traducción!*
  - type: dropdown
    id: language
    attributes:
      label: Language / Idioma
      options:
        - English (en)
        - Español (es)
        - Other / Otro (Propose new language)
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: ¿Dónde aparece el texto? / Location in the application
      placeholder: "Ej: Panel > Pestaña de Triggers > Botón de prueba / Settings tab"
    validations:
      required: true
  - type: textarea
    id: current_text
    attributes:
      label: Texto actual sin traducir o con errata / Current text
      placeholder: "Pega el texto tal como se muestra en pantalla"
    validations:
      required: true
  - type: textarea
    id: proposed_text
    attributes:
      label: Traducción sugerida / Proposed translation
      placeholder: "Escribe cómo debería decirse en ese contexto"
    validations:
      required: true
