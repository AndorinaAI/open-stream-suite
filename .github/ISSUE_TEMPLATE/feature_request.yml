name: ✨ Nueva funcionalidad / Feature request
description: Propón una mejora / Suggest an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema o necesidad / Problem or need
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas / Alternatives
  - type: dropdown
    id: os
    attributes:
      label: Target Operating System / Sistema operativo relevante
      description: ¿A qué sistema(s) operativo(s) aplica esta propuesta? / Which OS does this feature target?
      options:
        - All platforms / Todas las plataformas (Multiplataforma)
        - Linux
        - Windows
        - macOS
        - Not applicable / No aplica
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribución / Contribution
      options:
        - label: Me gustaría implementarlo yo / I'd like to implement it
