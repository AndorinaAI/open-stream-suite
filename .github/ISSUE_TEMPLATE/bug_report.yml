name: 🐛 Bug / Error
description: Algo no funciona como debería / Something is not working
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Rellena lo que puedas. / Thanks for reporting.
        ⚠️ **No pegues tokens, `.env` ni `client_secret`.** / Never paste tokens or secrets.
  - type: textarea
    id: description
    attributes:
      label: Descripción / Description
      description: ¿Qué ocurre? ¿Qué esperabas? / What happens? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir / Steps to reproduce
      placeholder: |
        1. Abrir el panel...
        2. Pulsar...
        3. Ver el error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área / Area
      options:
        - Panel
        - Alertas / Alerts
        - Widgets
        - Temas y escenas / Themes & scenes
        - Launcher / Bandeja / Tray
        - Instaladores / Installers
        - Plugins (Stream Deck, Ajazz, OpenDeck)
        - Traducciones / i18n
        - Documentación / Docs
        - Otro / Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / Sistema operativo
      description: Selecciona el sistema operativo donde ocurre el fallo / Select the OS where this issue occurs
      options:
        - Linux (Ubuntu / Debian / Mint)
        - Linux (Arch / Manjaro / EndeavourOS)
        - Linux (Fedora / RHEL)
        - Linux (Other / Otro)
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon M1/M2/M3/M4)
        - macOS (Intel)
        - Other / Otro
    validations:
      required: true
  - type: input
    id: os_version_details
    attributes:
      label: OS Version & Architecture / Versión exacta y arquitectura del SO
      description: p.ej. Ubuntu 24.04 x86_64, Windows 11 Pro 23H2, macOS Sonoma 14.5
      placeholder: "Ubuntu 24.04 LTS / Windows 11 23H2"
  - type: input
    id: version
    attributes:
      label: Versión / Version
      placeholder: "1.0.0-alpha"
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: Versión de OBS / OBS version
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas / Logs & screenshots
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones / Checklist
      options:
        - label: He buscado issues duplicados / I searched for duplicates
          required: true
        - label: He eliminado datos sensibles de los logs / I removed sensitive data
          required: true
