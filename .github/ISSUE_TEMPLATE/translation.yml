name: 🌍 Translation / Traducción
description: Missing or wrong translation / Falta o hay un error en una traducción
title: "[i18n]: "
labels: ["i18n"]
body:
  - type: input
    id: lang
    attributes:
      label: Language / Idioma
      placeholder: "en, es, fr, de, pt..."
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it appears / Dónde aparece
      description: Tab, menu, exact text / Pestaña, menú, texto exacto
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed text / Texto propuesto
    validations:
      required: true
