name: 🌍 Traducción / Translation
description: Falta o hay un error en una traducción / Missing or wrong translation
title: "[i18n]: "
labels: ["i18n"]
body:
  - type: input
    id: lang
    attributes:
      label: Idioma / Language
      placeholder: "es, en, fr..."
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Dónde aparece / Where it appears
      description: Pestaña, menú, texto exacto / Tab, menu, exact text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Texto propuesto / Proposed text
