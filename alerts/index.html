<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taller Live — Widget de Alertas y Triggers (OBS)</title>
  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="../common/themes.css">
  <link rel="stylesheet" href="../common/components.css">
  <style>
    /* Estilos del widget de alertas en OBS (100% transparente por defecto) */
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
    }

    html.preview-mode,
    body.preview-mode {
      background-color: #121518 !important;
    }

    .alerts-stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }

    /* Contenedor de la alerta visual */
    .alert-box {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px) scale(0.95);
      min-width: 540px;
      background: rgba(25, 29, 33, 0.94);
      border: 1px solid var(--color-border-cyan);
      border-top: 3px solid var(--color-accent-cyan);
      border-radius: var(--radius-sm);
      padding: 20px 32px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .alert-box.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .alert-icon-wrapper {
      width: 52px;
      height: 52px;
      background: rgba(87, 214, 196, 0.15);
      border: 1px solid var(--color-border-cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent-cyan);
      flex-shrink: 0;
    }

    .alert-icon-wrapper svg {
      width: 28px;
      height: 28px;
    }

    .alert-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-type-title {
      font-family: var(--font-tech);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--color-accent-cyan);
      text-transform: uppercase;
    }

    .alert-username {
      font-family: var(--font-primary);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--color-text-light);
      line-height: 1.1;
    }

    .alert-message {
      font-family: var(--font-tech);
      font-size: 13px;
      color: var(--color-text-dim);
      margin-top: 2px;
    }

    /* Esquinas técnicas en la alerta */
    .alert-corner-tr {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 12px;
      height: 12px;
      border-top: 2px solid var(--color-accent-cyan);
      border-right: 2px solid var(--color-accent-cyan);
    }

    .alert-corner-bl {
      position: absolute;
      bottom: -1px;
      left: -1px;
      width: 12px;
      height: 12px;
      border-bottom: 2px solid var(--color-accent-cyan);
      border-left: 2px solid var(--color-accent-cyan);
    }

    /* Contenedor de Vídeo / Meme (TriggerFyre) */
    .trigger-media-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 960px;
      max-height: 720px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 2000;
    }

    .trigger-media-container.visible {
      opacity: 1;
    }

    .trigger-video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Rótulo / Banner de Texto Personalizable */
    .trigger-caption-banner {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      border: 2px solid var(--color-accent-cyan);
      border-radius: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(87, 214, 196, 0.4);
      transition: all 0.25s ease-out;
      pointer-events: none;
    }

    .trigger-caption-banner.pos-below {
      top: calc(100% + 14px);
    }

    .trigger-caption-banner.pos-above {
      bottom: calc(100% + 14px);
    }

    .trigger-caption-banner.pos-inside {
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .trigger-caption-banner.pos-bottom_screen {
      position: absolute;
      bottom: 40px;
      left: 50%;
      top: auto;
      transform: translateX(-50%);
    }

    @keyframes bannerPop {
      0% { opacity: 0; transform: translateX(-50%) scale(0.65); }
      70% { transform: translateX(-50%) scale(1.08); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes bannerSlide {
      0% { opacity: 0; transform: translateX(-50%) translateY(24px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes bannerFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes bannerPulse {
      0% { transform: translateX(-50%) scale(0.95); opacity: 0.8; }
      50% { transform: translateX(-50%) scale(1.04); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    .trigger-caption-banner.anim-pop { animation: bannerPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .trigger-caption-banner.anim-slide { animation: bannerSlide 0.3s ease-out forwards; }
    .trigger-caption-banner.anim-fade { animation: bannerFade 0.3s ease-out forwards; }
    .trigger-caption-banner.anim-pulse { animation: bannerPulse 0.4s ease-out forwards; }

    /* Conexión status ping sutil */
    .ws-status-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: var(--font-tech);
      font-size: 10px;
      color: #10B981;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div class="alerts-stage">
    
    <!-- Alerta tipo Banner / Tarjeta Maker -->
    <div id="alert-card" class="alert-box">
      <div class="alert-corner-tr"></div>
      <div class="alert-corner-bl"></div>

      <div id="alert-icon" class="alert-icon-wrapper">
        <!-- Icono SVG inyectado -->
      </div>
      <div class="alert-content">
        <span id="alert-title" class="alert-type-title">¡NUEVO SEGUIDOR!</span>
        <span id="alert-user" class="alert-username">NombreDeUsuario</span>
        <span id="alert-msg" class="alert-message">Bienvenido al taller</span>
      </div>
    </div>

    <!-- Contenedor para Triggers de Vídeo / Memes / GIFs (TriggerFyre) -->
    <div id="trigger-container" class="trigger-media-container">
      <video id="trigger-video" class="trigger-video-element" playsinline></video>
      <img id="trigger-image" class="trigger-video-element" style="display: none;" alt="Trigger Media">
      <div id="trigger-caption" class="trigger-caption-banner" style="display: none;"></div>
    </div>

    <!-- Lienzo de Efectos y Partículas (Explosión de Emoticonos) -->
    <canvas id="fx-canvas" style="position: absolute; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%;"></canvas>

    <!-- Indicador de conexión sutil -->
    <div id="ws-indicator" class="ws-status-indicator">WS OK</div>
  </div>

  <script>
    // Generador de sonidos de sintetizador con Web Audio API nativo (sin dependencias de archivos)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playChime(type = 'sub') {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'susto') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.8);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc.start(now);
          osc.stop(now + 0.9);
        } else if (type === 'boom') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.7);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
          osc.start(now);
          osc.stop(now + 0.75);
        } else if (type === 'coin') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.09);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'victory') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc.start(now);
          osc.stop(now + 0.8);
        } else if (type === 'bell') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.start(now);
          osc.stop(now + 1.2);
        } else if (type === 'sub') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.12);
          osc.frequency.setValueAtTime(659.25, now + 0.24);
          osc.frequency.setValueAtTime(880, now + 0.36);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
          osc.start(now);
          osc.stop(now + 0.9);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.14);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.start(now);
          osc.stop(now + 0.7);
        }
      }
    };

    // Iconos SVG limpios
    const ICONS = {
      follow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`,
      sub: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`,
      bits: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 9l10 13 10-13-10-7z"></path></svg>`,
      trigger: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`
    };

    // Cola de alertas para que no se superpongan
    const AlertQueue = {
      queue: [],
      isPlaying: false,

      push(item) {
        this.queue.push(item);
        if (!this.isPlaying) {
          this.playNext();
        }
      },

      playNext() {
        if (this.queue.length === 0) {
          this.isPlaying = false;
          return;
        }

        this.isPlaying = true;
        const item = this.queue.shift();

        // Si es un trigger con vídeo / meme
        if (item.video_url) {
          this.playVideoTrigger(item);
        } else if (item.image_url) {
          this.playImageTrigger(item);
        } else {
          this.playCardAlert(item);
        }
      },

      playCardAlert(item) {
        const card = document.getElementById('alert-card');
        const icon = document.getElementById('alert-icon');
        const title = document.getElementById('alert-title');
        const user = document.getElementById('alert-user');
        const msg = document.getElementById('alert-msg');

        if (!card) {
          this.playNext();
          return;
        }

        const alertType = item.type || 'follow';
        if (icon) icon.innerHTML = ICONS[alertType] || ICONS.follow;
        if (title) title.textContent = item.title || (alertType === 'sub' ? '¡NUEVO SUSCRIPTOR!' : (alertType === 'bits' ? '¡CHEER CON BITS!' : (alertType === 'raid' ? '¡RAID RECIBIDA!' : '¡NUEVO SEGUIDOR!')));
        if (user) user.textContent = item.user || item.user_name || item.reward_title || 'Usuario';
        if (msg) msg.textContent = item.message || '';

        // Audio
        if (item.sound_url) {
          const snd = new Audio(item.sound_url);
          snd.volume = typeof item.sound_volume === 'number' ? item.sound_volume : (typeof item.volume === 'number' ? item.volume : 0.8);
          snd.play().catch(() => {});
        } else if (item.audio_type === 'chime' || !item.sound_url) {
          AudioEngine.playChime(item.chime_type || (alertType === 'sub' ? 'sub' : 'follow'));
        }

        card.classList.add('visible');

        setTimeout(() => {
          card.classList.remove('visible');
          setTimeout(() => this.playNext(), 400);
        }, item.duration || 5000);
      },

      applyTriggerPosition(container, pos, customX, customY, size) {
        container.style.top = '';
        container.style.left = '';
        container.style.right = '';
        container.style.bottom = '';
        container.style.transform = '';

        // Ajuste de tamaño
        if (size === 'small') {
          container.style.maxWidth = '360px';
          container.style.maxHeight = '270px';
        } else if (size === 'large') {
          container.style.maxWidth = '960px';
          container.style.maxHeight = '720px';
        } else if (size === 'fullscreen') {
          container.style.maxWidth = '1920px';
          container.style.maxHeight = '1080px';
          container.style.width = '1920px';
          container.style.height = '1080px';
        } else {
          container.style.maxWidth = '580px';
          container.style.maxHeight = '440px';
        }

        // Posición
        if (pos === 'random') {
          const randX = Math.floor(Math.random() * 65 + 15);
          const randY = Math.floor(Math.random() * 55 + 20);
          container.style.top = `${randY}%`;
          container.style.left = `${randX}%`;
          container.style.transform = 'translate(-50%, -50%)';
        } else if (pos === 'custom' && typeof customX === 'number' && typeof customY === 'number') {
          container.style.top = `${customY}%`;
          container.style.left = `${customX}%`;
          container.style.transform = 'translate(-50%, -50%)';
        } else if (pos === 'bottom-right') {
          container.style.bottom = '40px';
          container.style.right = '40px';
        } else if (pos === 'bottom-left') {
          container.style.bottom = '40px';
          container.style.left = '40px';
        } else if (pos === 'top-right') {
          container.style.top = '40px';
          container.style.right = '40px';
        } else if (pos === 'top-left') {
          container.style.top = '40px';
          container.style.left = '40px';
        } else {
          container.style.top = '50%';
          container.style.left = '50%';
          container.style.transform = 'translate(-50%, -50%)';
        }
      },

      applyTriggerCaption(caption, item) {
        if (!caption) return;
        const rawText = item.banner_text || item.title || '';
        if (item.show_banner_text !== false && rawText) {
          const user = item.user || item.user_name || 'Espectador';
          const reward = item.reward_title || '';
          const cost = item.cost ? `${item.cost} pts` : '';
          const text = rawText
            .replace(/\{user\}/gi, user)
            .replace(/\{reward\}/gi, reward)
            .replace(/\{cost\}/gi, cost);

          caption.textContent = text;

          // Personalización de estilos
          const textColor = item.banner_text_color || '#FFFFFF';
          const borderColor = item.banner_border_color || item.accent || '#57D6C4';
          const fontSize = item.banner_font_size === 'small' ? '14px' : (item.banner_font_size === 'large' ? '24px' : (item.banner_font_size === 'xlarge' ? '32px' : '18px'));
          const fontFamily = item.banner_font_family === 'pixel' ? 'monospace' : (item.banner_font_family === 'impact' ? 'Impact, sans-serif' : (item.banner_font_family === 'sans' ? 'var(--font-primary)' : 'var(--font-tech)'));

          caption.style.color = textColor;
          caption.style.borderColor = borderColor;
          caption.style.fontSize = fontSize;
          caption.style.fontFamily = fontFamily;
          caption.style.boxShadow = `0 0 24px ${borderColor}66, 0 8px 24px rgba(0,0,0,0.6)`;

          if (item.banner_bg_style === 'solid_black') {
            caption.style.background = '#0E1012';
            caption.style.borderWidth = '2px';
            caption.style.textShadow = 'none';
          } else if (item.banner_bg_style === 'accent') {
            caption.style.background = `${borderColor}33`;
            caption.style.borderWidth = '2px';
            caption.style.textShadow = 'none';
          } else if (item.banner_bg_style === 'none') {
            caption.style.background = 'transparent';
            caption.style.border = 'none';
            caption.style.boxShadow = 'none';
            caption.style.textShadow = `0 2px 10px #000, 0 0 16px ${borderColor}`;
          } else {
            caption.style.background = 'rgba(18, 22, 26, 0.94)';
            caption.style.borderWidth = '2px';
            caption.style.textShadow = 'none';
          }

          const anim = item.banner_animation || 'pop';
          const pos = item.banner_position || 'below';
          if (pos === 'bottom_screen') {
            const viewport = document.querySelector('.overlay-viewport');
            if (viewport && caption.parentElement !== viewport) {
              viewport.appendChild(caption);
            }
          } else {
            const container = document.getElementById('trigger-container');
            if (container && caption.parentElement !== container) {
              container.appendChild(caption);
            }
          }
          caption.className = `trigger-caption-banner anim-${anim} pos-${pos}`;
          caption.style.display = 'block';
        } else {
          caption.style.display = 'none';
        }
      },

      playVideoTrigger(item) {
        const container = document.getElementById('trigger-container');
        const video = document.getElementById('trigger-video');
        const img = document.getElementById('trigger-image');
        const caption = document.getElementById('trigger-caption');

        const posMode = item.position_mode || item.position || 'center';
        this.applyTriggerPosition(container, posMode, item.custom_x, item.custom_y, item.size);

        img.style.display = 'none';
        video.style.display = 'block';
        video.src = item.video_url;

        // Audio del vídeo o personalizado
        if (item.sound_url && item.audio_type === 'custom') {
          video.muted = true;
          const snd = new Audio(item.sound_url);
          snd.volume = typeof item.sound_volume === 'number' ? item.sound_volume : 0.8;
          snd.play().catch(() => {});
        } else if (item.audio_type === 'chime') {
          video.muted = true;
          AudioEngine.playChime(item.chime_type || 'susto');
        } else {
          video.muted = item.audio_type === 'none';
          video.volume = typeof item.sound_volume === 'number' ? item.sound_volume : (typeof item.volume === 'number' ? item.volume : 0.8);
        }

        // Texto en pantalla
        this.applyTriggerCaption(caption, item);

        container.classList.add('visible');

        video.onended = () => {
          container.classList.remove('visible');
          setTimeout(() => this.playNext(), 400);
        };

        video.onerror = () => {
          container.classList.remove('visible');
          this.playNext();
        };

        video.play().catch(() => {
          container.classList.remove('visible');
          this.playNext();
        });
      },

      playImageTrigger(item) {
        const container = document.getElementById('trigger-container');
        const video = document.getElementById('trigger-video');
        const img = document.getElementById('trigger-image');
        const caption = document.getElementById('trigger-caption');

        const posMode = item.position_mode || item.position || 'center';
        this.applyTriggerPosition(container, posMode, item.custom_x, item.custom_y, item.size);

        video.style.display = 'none';
        img.style.display = 'block';
        img.src = item.image_url;

        // Reproducir audio combinado
        if (item.sound_url) {
          const snd = new Audio(item.sound_url);
          snd.volume = typeof item.sound_volume === 'number' ? item.sound_volume : (typeof item.volume === 'number' ? item.volume : 0.8);
          snd.play().catch(() => {});
        } else if (item.audio_type === 'chime') {
          AudioEngine.playChime(item.chime_type || 'sub');
        }

        // Texto en pantalla
        this.applyTriggerCaption(caption, item);

        container.classList.add('visible');

        setTimeout(() => {
          container.classList.remove('visible');
          setTimeout(() => this.playNext(), 400);
        }, item.duration || 5000);
      }
    };

    // Motor de Partículas para Explosión de Emoticonos
    const ParticleEngine = {
      canvas: null,
      ctx: null,
      particles: [],
      isRunning: false,
      init() {
        this.canvas = document.getElementById('fx-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
      },
      resize() {
        if (!this.canvas) return;
        this.canvas.width = window.innerWidth || 1920;
        this.canvas.height = window.innerHeight || 1080;
      },
      explode(emoji = '🎉', count = 45) {
        this.init();
        if (!this.canvas || !this.ctx) return;
        const startX = this.canvas.width / 2;
        const startY = this.canvas.height / 2;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 18 + 6;
          this.particles.push({
            x: startX + (Math.random() - 0.5) * 100,
            y: startY + (Math.random() - 0.5) * 100,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 6,
            gravity: 0.38,
            size: Math.random() * 26 + 32,
            emoji: emoji,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 14,
            alpha: 1,
            decay: Math.random() * 0.012 + 0.008
          });
        }
        if (!this.isRunning) {
          this.isRunning = true;
          this.loop();
        }
      },
      loop() {
        if (!this.ctx) return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotSpeed;
          p.alpha -= p.decay;

          if (p.alpha <= 0 || p.y > this.canvas.height + 60) {
            this.particles.splice(i, 1);
            continue;
          }

          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, p.alpha);
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);
          this.ctx.font = `${p.size}px sans-serif`;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(p.emoji, 0, 0);
          this.ctx.restore();
        }

        if (this.particles.length > 0) {
          requestAnimationFrame(() => this.loop());
        } else {
          this.isRunning = false;
        }
      }
    };

    // Conexión WebSocket al servidor local
    function connectWS() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        const ind = document.getElementById('ws-indicator');
        ind.style.opacity = '1';
        setTimeout(() => ind.style.opacity = '0', 2500);
      };

      ws.onmessage = (event) => {
        try {
          const data = jsonParse(event.data);
          if (!data || data.type === 'system_status') return;

          if (data.type === 'theme_change' && data.theme) {
            document.body.setAttribute('data-theme', data.theme);
            return;
          }

          if (data.type === 'explode_emotes') {
            ParticleEngine.explode(data.emoji || '🎉', data.count || 45);
            return;
          }

          if (data.type === 'sound' && data.sound_url) {
            const snd = new Audio(data.sound_url);
            snd.volume = typeof data.volume === 'number' ? data.volume : 0.8;
            snd.play().catch(() => {});
            return;
          }

          AlertQueue.push(data);
        } catch (e) {}
      };

      ws.onclose = () => {
        setTimeout(connectWS, 2500);
      };
    }

    function jsonParse(str) {
      try { return JSON.parse(str); } catch (e) { return null; }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.search.includes('preview=true') || typeof window.obsstudio === 'undefined') {
        document.documentElement.classList.add('preview-mode');
        document.body.classList.add('preview-mode');
      }
      connectWS();
    });
  </script>
